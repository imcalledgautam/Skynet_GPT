name: GenAI Test Platform - Simple
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  genai-test-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov coverage requests
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi

      - name: Download GenAI Tools
        run: |
          echo "📦 Downloading GenAI Test Platform tools..."
          curl -L https://raw.githubusercontent.com/imcalledgautam/genai-test-platform/main/llm_agent/enhanced_context_builder.py -o context_builder.py
          curl -L https://raw.githubusercontent.com/imcalledgautam/genai-test-platform/main/llm_agent/generate_tests.py -o generate_tests.py
          curl -L https://raw.githubusercontent.com/imcalledgautam/genai-test-platform/main/llm_agent/prompt_template.txt -o prompt_template.txt
          echo "✅ Tools downloaded"

      - name: Detect Python Changes
        id: changes
        run: |
          echo "🔍 Detecting changed Python files..."
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep '\.py$' || echo "")
          else
            CHANGED_FILES=$(find . -name "*.py" -type f | head -5)
          fi
          
          if [ -n "$CHANGED_FILES" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "📝 Found Python changes"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "⚠️ No Python changes detected"
          fi

      - name: Build Context
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          echo "📋 Building context..."
          python context_builder.py

      - name: Install Ollama
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          echo "🤖 Installing Ollama..."
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 15
          echo "📦 Pulling model..."
          ollama pull qwen2.5-coder:1.5b
          echo "✅ Ollama ready"

      - name: Generate Tests
        if: steps.changes.outputs.has_changes == 'true'
        env:
          OLLAMA_MODEL: "qwen2.5-coder:1.5b"
          OLLAMA_HOST: "http://localhost:11434"
        run: |
          echo "🧠 Generating AI tests..."
          mkdir -p tests/generated
          python generate_tests.py || echo "⚠️ Generation completed with warnings"
          
          if [ -d "tests/generated" ]; then
            TEST_COUNT=$(find tests/generated -name "*.py" 2>/dev/null | wc -l)
            echo "✅ Generated $TEST_COUNT test files"
          fi

      - name: Run Tests
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          echo "🧪 Running tests..."
          mkdir -p reports
          
          if [ -d "tests/generated" ] && [ "$(ls tests/generated/*.py 2>/dev/null)" ]; then
            export PYTHONPATH=$PWD:$PYTHONPATH
            coverage run --source=. -m pytest tests/generated --disable-warnings -v || true
            coverage report -m | tee reports/coverage.txt
            coverage xml -o reports/coverage.xml
            echo "✅ Tests completed"
          else
            echo "No tests generated" > reports/coverage.txt
          fi

      - name: Upload Results
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: genai-results
          path: |
            tests/generated/
            reports/

      - name: Summary
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          echo "## 🤖 GenAI Test Platform Results" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "tests/generated" ] && [ "$(ls tests/generated/*.py 2>/dev/null)" ]; then
            TEST_COUNT=$(find tests/generated -name "*.py" 2>/dev/null | wc -l)
            echo "✅ **Generated $TEST_COUNT AI test files**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            head -10 reports/coverage.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Coverage data not available"
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **No tests generated**" >> $GITHUB_STEP_SUMMARY
          fi
