name: GenAI Test Platform - Self-Contained
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  genai-test-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov coverage requests pyyaml
          
          # Install project dependencies if they exist
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi

      - name: Detect Python Changes
        id: changes
        run: |
          echo "🔍 Detecting changed Python files..."
          git fetch origin main || git fetch origin master || true
          
          # Get changed files
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep '\.py$' | head -10 || echo "")
          else
            # First commit - get all Python files
            CHANGED_FILES=$(find . -name "*.py" -type f | head -10 | tr '\n' ' ')
          fi
          
          if [ -n "$CHANGED_FILES" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT
            echo "📝 Found Python changes: $CHANGED_FILES"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "⚠️ No Python changes detected"
          fi

      - name: Build Context Bundle
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          echo "📋 Building context bundle..."
          mkdir -p ci_artifacts
          
          # Create a simple context builder
          cat > build_context.py << 'EOF'
import os, json, sys
from datetime import datetime

def build_simple_context():
    changed_files = os.getenv('CHANGED_FILES', '').split()
    changed_files = [f for f in changed_files if f and os.path.exists(f)]
    
    bundle = {
        "metadata": {
            "timestamp": datetime.now().isoformat(),
            "total_files": len(changed_files),
            "changed_files": len(changed_files),
            "repository": os.getcwd()
        },
        "files": [],
        "context": {}
    }
    
    # Process changed files
    for file_path in changed_files:
        try:
            with open(file_path, 'r', encoding='utf-8') as f:
                content = f.read()
            
            bundle["files"].append({
                "path": file_path,
                "full_text": content[:15000],  # Limit size
                "unified_diff": f"Modified: {file_path}"
            })
            print(f"✅ Added {file_path} to context")
        except Exception as e:
            print(f"⚠️ Could not read {file_path}: {e}")
    
    # Add README if exists
    for readme in ['README.md', 'README.rst', 'README.txt']:
        if os.path.exists(readme):
            try:
                with open(readme, 'r') as f:
                    bundle["context"]["readme"] = f.read()[:2000]
                break
            except:
                pass
    
    # Save bundle
    with open('ci_artifacts/context_bundle.json', 'w') as f:
        json.dump(bundle, f, indent=2)
    
    print(f"✅ Context bundle created with {len(bundle['files'])} files")
    return len(bundle['files'])

if __name__ == "__main__":
    count = build_simple_context()
    sys.exit(0 if count > 0 else 1)
EOF
          
          # Run context builder
          CHANGED_FILES="${{ steps.changes.outputs.changed_files }}" python build_context.py

      - name: Install Ollama
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          echo "🤖 Installing Ollama..."
          curl -fsSL https://ollama.com/install.sh | sh
          
          # Start Ollama in background
          ollama serve &
          sleep 10
          
          # Pull smaller model for faster CI
          echo "📦 Pulling qwen2.5-coder:1.5b model..."
          ollama pull qwen2.5-coder:1.5b
          
          echo "✅ Ollama ready"

      - name: Generate Tests with AI
        if: steps.changes.outputs.has_changes == 'true'
        env:
          OLLAMA_MODEL: "qwen2.5-coder:1.5b"
          OLLAMA_HOST: "http://localhost:11434"
        run: |
          echo "🧠 Generating tests with AI..."
          
          # Download the test generator
          curl -L https://raw.githubusercontent.com/imcalledgautam/genai-test-platform/main/llm_agent/generate_tests.py -o generate_tests.py
          curl -L https://raw.githubusercontent.com/imcalledgautam/genai-test-platform/main/llm_agent/prompt_template.txt -o prompt_template.txt
          
          mkdir -p tests/generated
          
          # Run test generation
          python generate_tests.py || echo "⚠️ Test generation completed with warnings"
          
          # Count generated tests
          if [ -d "tests/generated" ]; then
            TEST_COUNT=$(find tests/generated -name "*.py" -type f 2>/dev/null | wc -l)
            echo "✅ Generated $TEST_COUNT test files"
            
            # List generated files
            find tests/generated -name "*.py" -type f 2>/dev/null | while read file; do
              echo "  📝 $(basename "$file")"
            done
          else
            echo "⚠️ No tests directory created"
          fi

      - name: Run Tests and Coverage
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          echo "🧪 Running tests with coverage..."
          
          mkdir -p reports
          
          if [ -d "tests/generated" ] && [ "$(ls -A tests/generated/*.py 2>/dev/null)" ]; then
            echo "Found generated tests, running pytest..."
            
            # Set PYTHONPATH and run tests
            export PYTHONPATH=$PWD:$PYTHONPATH
            
            # Run with coverage
            coverage run --source=. -m pytest tests/generated --maxfail=3 --disable-warnings -v || true
            coverage report -m | tee reports/coverage.txt
            coverage xml -o reports/coverage.xml
            
            echo "✅ Tests completed"
          else
            echo "⚠️ No generated tests to run"
            echo "No tests generated" > reports/coverage.txt
          fi

      - name: Upload Results
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: genai-test-results
          path: |
            tests/generated/
            reports/
            ci_artifacts/

      - name: Create Summary
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          echo "## 🤖 GenAI Test Platform Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "tests/generated" ] && [ "$(ls -A tests/generated/*.py 2>/dev/null)" ]; then
            TEST_COUNT=$(find tests/generated -name "*.py" -type f 2>/dev/null | wc -l)
            echo "### ✅ Success" >> $GITHUB_STEP_SUMMARY
            echo "- **Tests Generated:** $TEST_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            echo "### 📝 Generated Test Files" >> $GITHUB_STEP_SUMMARY
            find tests/generated -name "*.py" -type f 2>/dev/null | while read file; do
              echo "- \`$(basename "$file")\`" >> $GITHUB_STEP_SUMMARY
            done
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📊 Coverage Report" >> $GITHUB_STEP_SUMMARY
            if [ -f "reports/coverage.txt" ]; then
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              head -20 reports/coverage.txt >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### ⚠️ No Tests Generated" >> $GITHUB_STEP_SUMMARY
            echo "This might be because:" >> $GITHUB_STEP_SUMMARY
            echo "- No significant Python changes detected" >> $GITHUB_STEP_SUMMARY
            echo "- AI generation encountered issues" >> $GITHUB_STEP_SUMMARY
            echo "- Repository structure not compatible" >> $GITHUB_STEP_SUMMARY
          fi
