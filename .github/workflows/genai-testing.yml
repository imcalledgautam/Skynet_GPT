name: 🌐 GenAI Test Platform - Universal Test Generation

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      files:
        description: "Files to test (comma-separated)"
        required: false
        type: string
      auto_approve:
        description: "Auto-approve LLM-generated tests"
        required: false
        type: boolean
        default: false

jobs:
  genai-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # --------------------------
      # 1. CHECKOUT REPO
      # --------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------
      # 2. SETUP PYTHON ENVIRONMENT
      # --------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # --------------------------
      # 3. INSTALL AND START OLLAMA PROPERLY
      # --------------------------
      - name: Install and Configure Ollama
        run: |
          echo "🔧 Installing base dependencies..."
          sudo apt-get update -q -y
          sudo apt-get install -q -y curl jq git

          echo "🤖 Installing Ollama..."
          curl -fsSL https://ollama.com/install.sh | sh

          echo "🚀 Starting Ollama service..."
          ollama serve &
          sleep 5

          # Wait for Ollama to be ready
          echo "⏳ Waiting for Ollama to be ready..."
          for i in {1..30}; do
            if curl -f http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "✅ Ollama is ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

          echo "📦 Pulling LLM model..."
          ollama pull qwen2.5-coder:1.5b

          echo "🔍 Verifying Ollama setup..."
          curl -s http://localhost:11434/api/tags | jq .

          echo "✅ Ollama installed and configured successfully"

      # --------------------------
      # 4. SETUP GENAI TOOLS
      # --------------------------
      - name: Setup GenAI Tools
        run: |
          echo "📥 Setting up GenAI tools..."
          
          # Create the tools directory
          mkdir -p tools
          
          # Download the working unified_test_runner.py directly
          curl -o tools/unified_test_runner.py https://raw.githubusercontent.com/imcalledgautam/genai-test-platform/main/tools/unified_test_runner.py
          
          # Download the context builder
          curl -o tools/context_builder_v2.py https://raw.githubusercontent.com/imcalledgautam/genai-test-platform/main/tools/context_builder_v2.py
          
          # Clone and copy llm_agent
          git clone --depth 1 https://github.com/imcalledgautam/genai-test-platform.git /tmp/genai-platform
          cp -r /tmp/genai-platform/llm_agent .
          
          echo "📂 Verifying tools setup:"
          ls -la tools/
          ls -la llm_agent/
          
          # Install dependencies
          pip install pytest coverage requests pathlib2 || true
          echo "✅ GenAI tools ready"

      # --------------------------
      # 5. GENERATE TEST CASES VIA LLM
      # --------------------------
      - name: Generate AI Test Cases
        run: |
          echo "🧠 Generating tests using LLM..."
          mkdir -p tests/generated

          echo "🔍 Verifying Ollama is accessible..."
          curl -s http://localhost:11434/api/tags || {
            echo "❌ Ollama not accessible, restarting..."
            pkill ollama || true
            sleep 2
            ollama serve &
            sleep 10
            ollama pull qwen2.5-coder:1.5b
          }

          echo "📂 Current directory structure:"
          ls -la
          
          echo "📂 Available tools:"
          ls -la tools/

          export PYTHONPATH=".:$PYTHONPATH"
          export OLLAMA_HOST="http://localhost:11434"
          
          echo "🎯 Running unified test runner with increased timeouts..."
          python tools/unified_test_runner.py --auto-approve \
            || echo "⚠️ AI test generation completed with warnings"

          echo "✅ Test generation completed"
          
          echo "📁 Generated test files:"
          find tests/ -name "*.py" -type f | head -10 || echo "No test files generated"

      # --------------------------
      # 6. RUN TESTS AND COLLECT COVERAGE
      # --------------------------
      - name: Run Tests and Collect Coverage
        if: always()
        run: |
          mkdir -p genai_artifacts reports

          pip install pytest pytest-cov coverage
          echo "🔍 Checking for generated tests..."
          find tests/ -name "*.py" -type f | head -5 || echo "No test files found"
          
          if [ -d "tests" ] && [ "$(find tests/ -name '*.py' | wc -l)" -gt 0 ]; then
            echo "▶️ Running pytest..."
            pytest tests/ --disable-warnings -v --tb=short \
              --cov=. --cov-report=xml:reports/coverage.xml --cov-report=term-missing \
              2>&1 | tee reports/test-results.log || echo "⚠️ Tests completed with warnings"
          else
            echo "ℹ️ No test files found to execute"
          fi

          echo "✅ Test execution phase complete"

      # --------------------------
      # 7. UPLOAD RESULTS
      # --------------------------
      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genai-test-results
          path: |
            tests/
            genai_artifacts/
            reports/
            *.xml
            *.json
          retention-days: 30
